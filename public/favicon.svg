<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The same object as the hero and the theme toggle: a unit lattice with a
       single corner notch. Theme-aware, so it sits correctly in a dark tab
       strip as well as a light one. Colors mirror tokens.css. -->
  <style>
    .ground { fill: #EFE8DA; }
    .unit   { fill: #7E5B18; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #17120E; }
      .unit   { fill: #C9A227; }
    }
  </style>
  <rect class="ground" width="32" height="32"/>
  <g class="unit">
    <!-- row 1, notched at the right -->
    <rect x="5"  y="5"  width="5" height="5"/>
    <rect x="11" y="5"  width="5" height="5"/>
    <!-- row 2, notch continues -->
    <rect x="5"  y="11" width="5" height="5"/>
    <rect x="11" y="11" width="5" height="5"/>
    <!-- rows 3 and 4, full -->
    <rect x="5"  y="17" width="5" height="5"/>
    <rect x="11" y="17" width="5" height="5"/>
    <rect x="17" y="17" width="5" height="5"/>
    <rect x="23" y="17" width="4" height="5"/>
    <rect x="5"  y="23" width="5" height="4"/>
    <rect x="11" y="23" width="5" height="4"/>
    <rect x="17" y="23" width="5" height="4"/>
    <rect x="23" y="23" width="4" height="4"/>
  </g>
</svg>
